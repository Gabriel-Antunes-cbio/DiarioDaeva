# Gera o DiarioDeDaeva.exe e publica numa Release do GitHub.
# Para lançar uma versão: atualize __version__ em daeva/__init__.py, faça commit e crie a tag:
#   git tag v1.0.0
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Testes
        run: python -m pytest -q

      - name: Gerar o .exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name DiarioDeDaeva
          --icon assets/icon.ico
          --add-data "assets;assets"
          app.py

      - name: Guardar o .exe como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: DiarioDeDaeva
          path: dist/DiarioDeDaeva.exe

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiarioDeDaeva.exe
          generate_release_notes: true
